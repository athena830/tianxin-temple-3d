<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>玉皇宮 Phase 3 — Stage 1.5 GLB 資產管線驗證</title>
  <style>
    body { margin: 0; padding: 0; overflow: hidden; background: #1a1614; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #e8d0a0; }
    #canvas-container { width: 100vw; height: 100vh; display: block; }
    #info-panel {
      position: absolute; top: 16px; left: 16px; z-index: 100;
      background: rgba(26, 20, 16, 0.92); border: 1px solid #997a3d;
      border-radius: 8px; padding: 14px 20px; max-width: 480px; font-size: 13px; line-height: 1.6;
      backdrop-filter: blur(6px); box-shadow: 0 8px 24px rgba(0,0,0,0.65);
    }
    h2 { margin: 0 0 10px 0; font-size: 16px; color: #ffd700; border-bottom: 1px solid #785a28; padding-bottom: 6px; letter-spacing: 0.5px; }
    .badge { display: inline-block; padding: 2px 7px; border-radius: 4px; font-weight: bold; font-size: 11px; margin-right: 4px; }
    .badge-ok { background: #1b5e20; color: #a5d6a7; border: 1px solid #2e7d32; }
    .btn-group { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
    button {
      background: #3e2723; color: #ffe082; border: 1px solid #a1887f; border-radius: 4px;
      padding: 6px 14px; cursor: pointer; font-size: 12px; font-weight: 500; transition: all 0.2s ease;
    }
    button:hover { background: #5d4037; border-color: #ffd54f; }
    button.active { background: #d84315; color: #fff; border-color: #ffab91; }
    #metrics-list { margin: 8px 0; font-family: Consolas, monospace; font-size: 11.5px; color: #d7ccc8; max-height: 140px; overflow-y: auto; }
  </style>
</head>
<body>
  <div id="info-panel">
    <h2>玉皇宮 3D GLB 管線驗證 (Stage 1.5)</h2>
    <div id="status-badge"><span class="badge badge-ok">載入中...</span></div>
    <div id="metrics-list"></div>
    <div class="btn-group">
      <button id="btn-front" onclick="window.setView('front')">正面 (Front)</button>
      <button id="btn-side" onclick="window.setView('side')">側面 (Side)</button>
      <button id="btn-angle45" onclick="window.setView('angle45')">45° 透視 (Angle 45°)</button>
      <button id="btn-dispose" onclick="window.runDisposeTest()">釋放測試 (Dispose Test)</button>
    </div>
  </div>
  <div id="canvas-container"></div>
  <script type="module" src="/src/preview-glb.ts"></script>
</body>
</html>
