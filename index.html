    <script>
      // Fallback for static hosting (GitHub Pages main branch) where /src/main.ts is not served by Vite
      window.addEventListener('DOMContentLoaded', function () {
        setTimeout(function () {
          if (!window.__TEMPLE_LOADED__ && !document.querySelector('script[src*="assets/index.js"]')) {
            var s = document.createElement('script');
            s.type = 'module';
            s.crossOrigin = '';
            s.src = './assets/index.js';
            document.head.appendChild(s);
          }
        }, 150);
      });
